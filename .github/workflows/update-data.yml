name: Update ETF data

on:
  # Manual only — no schedule. Run it from the repo's Actions tab
  # (Run workflow) whenever you want fresh data.
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh data.js from Yahoo Finance
        run: python3 scripts/update_data.py
      - name: Commit if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.js
          if git diff --cached --quiet; then
            echo "No data change."
          else
            git commit -m "chore: update ETF data"
            git push
          fi
